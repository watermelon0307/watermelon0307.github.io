<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#100F13">
<title>WARMTH 一起聽</title>
<style>
:root{
  --bg:#100F13;--surface:#19171D;--raised:#242128;--text:#F6F2F4;--text2:#BDB5C0;--text3:#A49BA8;
  --accent:#F28DA7;--soft:#F9D0DA;--ink:#301A25;--line:rgba(255,255,255,.07);--ok:#8CD3B5;--err:#FF9A9A;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--soft);outline-offset:2px}
[hidden]{display:none!important}
.serif{font-family:Georgia,"Times New Roman",serif}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pearl{background:radial-gradient(120% 120% at 30% 18%,#FFF6F8 0%,#F9D0DA 46%,#E9A9BC 100%);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -3px 6px rgba(150,60,92,.3),0 10px 24px rgba(0,0,0,.45)}
.raised{background:linear-gradient(180deg,#211E25,#17151A);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.06)}
.glass{background:linear-gradient(180deg,rgba(62,55,68,.82),rgba(28,25,32,.92));-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 16px 40px rgba(0,0,0,.45)}
.vinyl{border-radius:50%;background:conic-gradient(from 58deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.17) 16deg,rgba(255,255,255,0) 38deg,rgba(255,255,255,0) 180deg,rgba(255,255,255,.12) 197deg,rgba(255,255,255,0) 220deg,rgba(255,255,255,0) 360deg),repeating-radial-gradient(circle,#0D0C0F 0px,#0D0C0F .7px,#232126 1.3px,#131215 2.1px)}

#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(var(--sat) + 16px) 20px calc(var(--sab) + 96px);position:relative}
.glow{position:fixed;left:-140px;top:-180px;width:420px;height:420px;border-radius:50%;background:#B4546F;filter:blur(100px);opacity:.24;pointer-events:none}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-size:34px;line-height:36px;letter-spacing:.04em}
.brand b{color:var(--accent);font-weight:400}
.tag{font-size:13px;color:var(--text2);letter-spacing:.08em;margin-top:2px}
.who{display:flex;align-items:center;gap:10px}
.duo{display:flex}
.duo .av{width:36px;height:36px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--bg),0 0 0 3px rgba(255,255,255,.14);background:linear-gradient(150deg,#8E7AB8,#2E2540);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.duo .av + .av{margin-left:-10px;background:linear-gradient(150deg,#E08DAA,#4A2748)}
.loginBtn{min-height:44px;padding:0 14px;border-radius:14px;font-size:13px;max-width:132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.search{display:flex;gap:8px;margin-top:16px}
.search label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:16px;color:var(--text3)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:15px}
.search input::placeholder{color:var(--text3)}
.search button{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

.hint{margin:56px 0;text-align:center;color:var(--text3);font-size:14px;line-height:1.6}
.hint .serif{display:block;font-style:italic;font-size:20px;color:var(--text2);margin-bottom:6px}
.sec{display:flex;align-items:baseline;gap:10px;margin:18px 0 4px}
.sec h2{margin:0;font-size:18px}
.sec span{font-style:italic;font-size:15px;color:var(--text3)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 0;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row img,.row .ph{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none;background:linear-gradient(160deg,#34313A,#1E1C22);box-shadow:0 6px 12px rgba(0,0,0,.4)}
.row .meta{flex:1;min-width:0}
.row .t{font-size:15px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;line-height:18px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;flex:none}
.row.on .t{color:var(--soft)}
.row.off .t,.row.off .s{color:#8B8391}
.pill{display:inline-block;font-size:11px;line-height:16px;padding:0 6px;margin-left:6px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);color:var(--text2);vertical-align:1px}
.more{display:block;width:100%;min-height:48px;margin-top:8px;border-radius:14px;font-size:14px;color:var(--text2)}

.mini{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 12px);max-width:496px;margin:0 auto;height:62px;border-radius:20px;display:flex;align-items:center;padding:0 4px 0 10px;overflow:hidden;z-index:5}
.mini .open{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:12px;text-align:left}
.mini .disc{position:relative;width:42px;height:42px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 4px 10px rgba(0,0,0,.5)}
.mini .disc img{position:absolute;inset:10px;width:22px;height:22px;border-radius:50%;object-fit:cover}
.mini .t{font-size:14px;line-height:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .s{font-size:12px;line-height:16px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.mini .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.08)}
.mini .bar i{display:block;height:2px;width:0;background:linear-gradient(90deg,#E9A9BC,#FCE3EA)}

.player{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--sat) + 8px) 20px calc(var(--sab) + 20px);overflow:hidden}
.player .amb{position:absolute;left:50%;top:14%;width:340px;height:340px;margin-left:-170px;border-radius:50%;background:#B4546F;filter:blur(90px);opacity:.3;pointer-events:none}
.player header{position:relative;display:flex;align-items:center;justify-content:space-between;height:44px;margin:0 -10px}
.player header .ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.player header .c{text-align:center;font-size:11px;letter-spacing:.24em;color:var(--text2)}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage .big{position:relative;width:min(72vw,300px,42vh);aspect-ratio:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),inset 0 0 0 3px #060507,0 30px 60px rgba(0,0,0,.6)}
.stage .big .label{position:absolute;inset:23%;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,#34313A,#1E1C22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);animation:spin 28s linear infinite;animation-play-state:paused}
.stage .big .label img{width:100%;height:100%;object-fit:cover;display:block}
.playing .stage .big .label{animation-play-state:running}
.stage .big .hole{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#B9B5BE 38%,#5A5660 80%);box-shadow:0 0 0 3px #0B0A0D}
@keyframes spin{to{transform:rotate(360deg)}}
.lyrics{position:absolute;inset:0;overflow-y:auto;padding:38% 8px;scrollbar-width:none;-webkit-mask:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent)}
.lyrics::-webkit-scrollbar{display:none}
.lyrics p{margin:0 0 18px;font-size:17px;line-height:26px;color:#8B8391;transition:color .2s,font-size .2s}
.lyrics p small{display:block;font-size:13px;line-height:19px;color:inherit;opacity:.85}
.lyrics p.on{font-size:23px;line-height:33px;font-weight:700;color:var(--text)}
.lyrics p.on small{font-size:14px;font-weight:400;color:var(--text2)}
.lyrics .none{text-align:center;color:var(--text3)}
.info{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.info h1{margin:0;font-size:24px;line-height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .s{font-size:14px;line-height:20px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--text2)}
.info .ic[aria-pressed="true"]{color:var(--soft)}
.seek{position:relative;margin-top:14px}
.seek input{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:none;--p:0%}
.seek input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#E9A9BC,#FCE3EA) 0/var(--p) 100% no-repeat,rgba(255,255,255,.12)}
.seek input::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.seek input::-moz-range-progress{height:4px;border-radius:2px;background:#F9D0DA}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#F1E6EA 55%,#C9B9C0);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.seek input::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#F6F2F4}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.ctl{position:relative;display:flex;align-items:center;justify-content:center;gap:28px;margin-top:10px}
.ctl .ic{width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.ctl .ic svg{width:30px;height:30px}
.ctl .pp{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ctl .pp svg{width:30px;height:30px}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,7,10,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{width:100%;max-width:520px;max-height:92%;overflow:auto;padding:20px 20px calc(var(--sab) + 20px);border-radius:28px 28px 0 0;background:linear-gradient(180deg,#221F27,#17151A);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.sheet h2{margin:0;font-size:20px}
.sheet .sub{margin:6px 0 16px;font-size:13px;line-height:1.6;color:var(--text2)}
.qr{display:flex;flex-direction:column;align-items:center;gap:12px}
.qr canvas{width:216px;height:216px;border-radius:16px;background:#fff;image-rendering:pixelated}
.qr .st{min-height:20px;font-size:14px;color:var(--soft);text-align:center}
.sheet details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.sheet summary{min-height:44px;display:flex;align-items:center;font-size:14px;color:var(--text2);cursor:pointer}
.sheet textarea{width:100%;min-height:76px;padding:10px 12px;border-radius:12px;border:0;outline:0;resize:vertical;color:var(--text);font:13px/1.5 ui-monospace,Menlo,monospace}
.sheet .acts{display:flex;gap:8px;margin-top:12px}
.sheet .acts button{flex:1;min-height:48px;border-radius:14px;font-size:15px}
.acct{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.acct img{width:52px;height:52px;border-radius:50%;object-fit:cover}
#toast{position:fixed;left:50%;width:max-content;bottom:calc(var(--sab) + 92px);transform:translateX(-50%);z-index:30;max-width:86%;padding:10px 16px;border-radius:14px;font-size:14px;line-height:1.4;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.stage .big .label{animation:none}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div id="app">
  <header class="top">
    <div>
      <div class="brand serif">WARMTH<b>.</b></div>
      <div class="tag">讓音樂留在今天。</div>
    </div>
    <div class="who">
      <div class="duo" aria-hidden="true">
        <img class="av" src="av/huihui.png" alt="" data-fallback="H">
        <img class="av" src="av/shenshen.png" alt="" data-fallback="S">
      </div>
      <button id="loginBtn" class="loginBtn raised">登入</button>
    </div>
  </header>

  <form id="searchForm" class="search" role="search">
    <label class="raised">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <span class="sr">搜尋歌曲、歌手、專輯</span>
      <input id="q" type="search" placeholder="搜尋歌曲、歌手、專輯" autocomplete="off" enterkeyhint="search">
    </label>
    <button class="pearl" aria-label="搜尋">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <main id="main">
    <div id="hint" class="hint"><span class="serif">Tonight's first song</span>搜尋一首歌，開始一起聽。</div>
    <div id="results" hidden>
      <div class="sec"><h2>單曲</h2><span class="serif">Songs</span></div>
      <div id="list"></div>
      <button id="moreBtn" class="more raised" hidden>載入更多</button>
    </div>
  </main>
</div>

<div id="mini" class="mini glass" hidden>
  <button class="open" id="miniOpen" aria-label="開啟播放器">
    <span class="disc vinyl"><img id="miniCover" alt=""></span>
    <span style="min-width:0"><span class="t" id="miniTitle" style="display:block"></span><span class="s" id="miniArtist" style="display:block"></span></span>
  </button>
  <button class="ic" id="miniPlay" aria-label="播放"></button>
  <button class="ic" id="miniNext" aria-label="下一首">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M5 6.2v11.6c0 .6.6.9 1.1.6l8.9-5.8a.7.7 0 0 0 0-1.2L6.1 5.6c-.5-.3-1.1 0-1.1.6z"/><rect x="16.6" y="5.5" width="2.4" height="13" rx="1.2"/></svg>
  </button>
  <div class="bar" aria-hidden="true"><i id="miniBar"></i></div>
</div>

<section id="player" class="player" hidden aria-label="播放器">
  <div class="amb" aria-hidden="true"></div>
  <header>
    <button class="ic" id="closePlayer" aria-label="收合播放器"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="c">正在播放</div>
    <span class="ic" aria-hidden="true"></span>
  </header>
  <div class="stage">
    <button id="disc" class="big vinyl" aria-label="切換歌詞">
      <span class="label"><img id="cover" alt=""></span>
      <span class="hole"></span>
    </button>
    <div id="lyrics" class="lyrics" hidden></div>
  </div>
  <div class="info">
    <div style="min-width:0">
      <h1 id="title"></h1>
      <div class="s" id="artist"></div>
    </div>
    <button class="ic" id="lyricBtn" aria-label="歌詞" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h9M5 17h12"/></svg></button>
  </div>
  <div class="seek">
    <label class="sr" for="seek">播放進度</label>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1">
    <div class="times"><span id="cur">00:00</span><span id="dur">00:00</span></div>
  </div>
  <div class="ctl">
    <button class="ic" id="prev" aria-label="上一首"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.2v11.6c0 .6-.6.9-1.1.6L9 12.6a.7.7 0 0 1 0-1.2l8.9-5.800c.5-.3 1.1 0 1.1.6z"/><rect x="5" y="5.5" width="2.4" height="13" rx="1.2"/></svg></button>
    <button class="pp pearl" id="play" aria-label="播放"></button>
    <button class="ic" id="next" aria-label="下一首"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 6.2v11.6c0 .6.6.9 1.1.6l8.9-5.8a.7.7 0 0 0 0-1.2L6.1 5.6c-.5-.3-1.1 0-1.1.6z"/><rect x="16.6" y="5.5" width="2.4" height="13" rx="1.2"/></svg></button>
  </div>
</section>

<div id="login" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <div class="box">
    <div id="loginOut">
      <h2 id="loginTitle">掃碼登入</h2>
      <p class="sub">用網易雲音樂 App 掃描。若 App 在同一支手機上，先截圖，再到 App 的「掃一掃」從相簿選取。</p>
      <div class="qr">
        <canvas id="qrCanvas" width="216" height="216" aria-label="登入二維碼"></canvas>
        <div class="st" id="qrStatus" role="status"></div>
      </div>
      <details>
        <summary>掃碼不行？改貼 Cookie</summary>
        <p class="sub">在瀏覽器登入 music.163.com 後，把 Cookie 裡的 MUSIC_U 貼到這裡，只會存在本機的 cookie.txt。</p>
        <label class="sr" for="cookieBox">MUSIC_U</label>
        <textarea id="cookieBox" class="raised" placeholder="MUSIC_U=…" spellcheck="false"></textarea>
        <div class="acts"><button id="cookieSave" class="pearl">儲存並登入</button></div>
      </details>
      <div class="acts"><button id="qrRefresh" class="raised">重新取得二維碼</button><button class="raised" data-close>關閉</button></div>
    </div>
    <div id="loginIn" hidden>
      <h2>帳號</h2>
      <div class="acct"><img id="acctAvatar" alt=""><div><div id="acctName" style="font-size:17px;font-weight:600"></div><div class="sub" style="margin:2px 0 0">已登入網易雲音樂</div></div></div>
      <div class="acts"><button id="logoutBtn" class="raised">登出</button><button class="pearl" data-close>完成</button></div>
    </div>
  </div>
</div>

<div id="toast" class="glass" role="status" aria-live="polite"></div>
<audio id="audio" preload="auto"></audio>
<script>
/*
 * qrcodegen.js — 精簡 QR Code 產生器
 * Byte 模式、容錯等級 M、版本 1–10（最多約 213 個位元組，登入連結綽綽有餘）。
 *
 *   var qr = QRGen.encode('https://…');      // { size, modules[y][x] }，1 = 深色
 *   QRGen.toCanvas(canvas, 'https://…', { scale: 6, margin: 4 });
 */
(function (root) {
  'use strict';

  // 容錯等級 M：每個區塊的糾錯碼字數、區塊數（索引 = 版本）
  var EC_PER_BLOCK = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  var NUM_BLOCKS = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  var MAX_VERSION = 10;

  // ── GF(256)，原始多項式 x^8+x^4+x^3+x^2+1 ──
  var EXP = new Uint8Array(512);
  var LOG = new Uint8Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) {
      EXP[i] = x;
      LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11d;
    }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
  })();

  function mul(a, b) {
    return a && b ? EXP[LOG[a] + LOG[b]] : 0;
  }

  function rsGenerator(degree) {
    var g = [1];
    for (var i = 0; i < degree; i++) {
      var next = new Array(g.length + 1).fill(0);
      for (var j = 0; j < g.length; j++) {
        next[j] ^= g[j];
        next[j + 1] ^= mul(g[j], EXP[i]);
      }
      g = next;
    }
    return g;
  }

  function rsRemainder(data, gen) {
    var degree = gen.length - 1;
    var rem = new Array(degree).fill(0);
    for (var i = 0; i < data.length; i++) {
      var factor = data[i] ^ rem.shift();
      rem.push(0);
      for (var j = 0; j < degree; j++) rem[j] ^= mul(gen[j + 1], factor);

<script>
/* WARMTH 一起聽 — 前端互動邏輯（搜尋 / 播放 / 歌詞 / 進度 / 掃碼登入 / 同步目前播放） */
(function () {
  'use strict';

    songs: [],        // 搜尋結果，同時是播放佇列
    index: -1,        // 目前播放在 songs 裡的位置
    song: null,
    query: '',
    total: 0,
    lyrics: [],       // [{t, text, tr}]
    lyricIdx: -1,
    showLyrics: false,
    seeking: false,
    playToken: 0,     // 防止快速切歌時舊回應蓋掉新歌
    retried: false,
    loggedIn: false,
    profile: null,
    qrKey: null,
    qrTimer: null,
    remoteSeq: -1,
    lastSync: 0

  var ICON_PLAY = '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M8.5 5.2v13.6c0 .6.6.9 1.1.6l10-6.8a.7.7 0 0 0 0-1.2l-10-6.8c-.5-.3-1.1 0-1.1.6z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.8" height="14" rx="1.2"/><rect x="13.7" y="5" width="3.8" height="14" rx="1.2"/></svg>';

  // ───────────── 小工具 ─────────────

        return encodeURIComponent(k) + '=' + encodeURIComponent(payload[k]);

    else img.removeAttribute('src');
  }

  function search(append) {

    var offset = append ? state.songs.length : 0;
    if (!append) state.query = q;
    $('moreBtn').disabled = true;
    api.get('/api/search', { q: state.query, limit: 30, offset: offset }).then(function (data) {

  }

    }
  }

  function setLyricsView(on) {
    state.showLyrics = on;
    $('lyrics').hidden = !on;
    $('disc').hidden = on;
    $('lyricBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) {
      var node = $('lyrics').querySelector('p.on');
      if (node) $('lyrics').scrollTop = node.offsetTop - $('lyrics').clientHeight / 2;
    }
  }

  // ───────────── 同步目前播放 / 遙控 ─────────────

  function syncNow(force) {
    var now = Date.now();
    if (!force && now - state.lastSync < 5000) return;
    state.lastSync = now;
    var s = state.song;
    var line = state.lyrics[state.lyricIdx];
    var body = s ? {
      id: s.id, name: s.name, artists: s.artists, album: s.album, cover: s.cover,
      position: Math.round((audio.currentTime || 0) * 100) / 100,
      duration: Math.round((audio.duration || s.duration / 1000) * 100) / 100,
      playing: !audio.paused && !audio.ended,
      lyric: line ? line.text : ''
    } : { playing: false };
    api.post('/api/nowplaying', body).catch(function () {});
    tellParent(body);
  }

  // 被餘溫 App 嵌成面板時：回報目前播放（只含歌名等公開資訊），並接受外層要求暫停
  var PARENTS = /^(https:\/\/watermelon0307\.github\.io|https:\/\/localhost|capacitor:\/\/localhost|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?)$/;
  var parentOrigin = '';
  if (window.parent !== window && location.ancestorOrigins && PARENTS.test(location.ancestorOrigins[0] || '')) {
    parentOrigin = location.ancestorOrigins[0];
  }
  function tellParent(body) {
    if (!parentOrigin) return;
    window.parent.postMessage({ source: 'ncm_web', type: 'state', playing: !!body.playing, id: body.id || null, name: body.name || '', artists: body.artists || [] }, parentOrigin);
  }
  window.addEventListener('message', function (e) {
    if (!parentOrigin || e.source !== window.parent || e.origin !== parentOrigin) return;
    if (e.data && e.data.target === 'ncm_web' && e.data.cmd === 'pause') audio.pause();
  });

  function pollRemote() {
    api.get('/api/remote', { since: state.remoteSeq }).then(function (data) {
      state.remoteSeq = data.seq;
      (data.cmds || []).forEach(function (c) {
        if (c.cmd === 'toggle') toggle();
        else if (c.cmd === 'play') { if (audio.paused) toggle(); }
        else if (c.cmd === 'pause') audio.pause();
        else if (c.cmd === 'next') next(false);
        else if (c.cmd === 'prev') prev();
        else if (c.cmd === 'seek' && isFinite(c.value)) audio.currentTime = Math.max(0, Number(c.value));
        else if (c.cmd === 'volume' && isFinite(c.value)) audio.volume = Math.min(1, Math.max(0, Number(c.value)));
      });
    }).catch(function () {}).then(function () { setTimeout(pollRemote, 1500); });
  }

  // ───────────── 登入 ─────────────

  function renderLoginState() {
    var btn = $('loginBtn');
    btn.textContent = state.loggedIn ? (state.profile.nickname || '已登入') : '登入';
    $('loginOut').hidden = state.loggedIn;
    $('loginIn').hidden = !state.loggedIn;
    if (state.loggedIn) {
      $('acctName').textContent = state.profile.nickname || '';
      setImg($('acctAvatar'), state.profile.avatarUrl ? state.profile.avatarUrl + '?param=120y120' : '');
    }
  }

  function refreshStatus() {
    return api.get('/api/status').then(function (st) {
      state.loggedIn = !!st.loggedIn;
      state.profile = st.loggedIn ? st : null;
      if (st.expired) toast('登入已過期，請重新登入');
      renderLoginState();
      return st;
    }).catch(function (e) { toast(e.message); });
  }

  function stopQr() {
    clearTimeout(state.qrTimer);
    state.qrTimer = null;
    state.qrKey = null;
  }

  function startQr() {
    stopQr();
    var status = $('qrStatus');
    status.textContent = '取得二維碼中…';
    var ctx = $('qrCanvas').getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, $('qrCanvas').width, $('qrCanvas').height);
    api.get('/api/unikey').then(function (data) {
      if ($('login').hidden) return;
      state.qrKey = data.unikey;
      QRGen.toCanvas($('qrCanvas'), data.qrurl, { scale: 6, margin: 4 });
      status.textContent = '等待掃碼';
      pollQr(data.unikey);
    }).catch(function (e) { status.textContent = e.message; });
  }

  function pollQr(key) {
    state.qrTimer = setTimeout(function () {
      if (state.qrKey !== key) return;
      api.get('/api/check', { key: key }).then(function (r) {
        if (state.qrKey !== key) return;
        var status = $('qrStatus');
        if (r.code === 800) { status.textContent = '二維碼已過期，請重新取得'; stopQr(); return; }
        if (r.code === 803) {
          stopQr();
          status.textContent = '登入成功';
          refreshStatus().then(function () { toast('登入成功'); });
          return;
        }
        if (r.code === 802) status.textContent = (r.nickname ? r.nickname + '，' : '') + '請在手機上確認登入';
        else if (r.code === 801) status.textContent = '等待掃碼';
        else status.textContent = r.message || ('登入被拒絕（code ' + r.code + '），可改貼 Cookie');
        pollQr(key);
      }).catch(function (e) {
        if (state.qrKey !== key) return;
        $('qrStatus').textContent = e.message;
        pollQr(key);
      });
    }, 2000);
  }

  function openLogin() {
    $('login').hidden = false;
    renderLoginState();
    if (!state.loggedIn) startQr();
  }

  function closeLogin() {
    stopQr();
    $('login').hidden = true;
  }

  // ───────────── 事件綁定 ─────────────

  $('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    $('q').blur();
    search(false);
  });
  $('moreBtn').addEventListener('click', function () { search(true); });

  $('play').addEventListener('click', toggle);
  $('miniPlay').addEventListener('click', toggle);
  $('next').addEventListener('click', function () { next(false); });
  $('miniNext').addEventListener('click', function () { next(false); });
  $('prev').addEventListener('click', prev);
  $('miniOpen').addEventListener('click', function () { $('player').hidden = false; });
  $('closePlayer').addEventListener('click', function () { $('player').hidden = true; });
  $('disc').addEventListener('click', function () { setLyricsView(true); });
  $('lyricBtn').addEventListener('click', function () { setLyricsView(!state.showLyrics); });

  var seek = $('seek');
  seek.addEventListener('input', function () {
    state.seeking = true;
    var dur = audio.duration || 0;
    seek.style.setProperty('--p', seek.value / 10 + '%');
    $('cur').textContent = fmt((seek.value / 1000) * dur);
  });
  seek.addEventListener('change', function () {
    var dur = audio.duration || 0;
    if (dur) audio.currentTime = (seek.value / 1000) * dur;
    state.seeking = false;
    syncNow(true);
  });

  audio.addEventListener('timeupdate', function () { renderProgress(); syncNow(false); });
  audio.addEventListener('durationchange', renderProgress);
  audio.addEventListener('play', function () { renderPlayState(); syncNow(true); });
  audio.addEventListener('playing', function () { state.retried = false; });
  audio.addEventListener('pause', function () { renderPlayState(); syncNow(true); });
  audio.addEventListener('ended', function () { renderPlayState(); syncNow(true); next(true); });
  audio.addEventListener('error', function () {
    if (!state.song || !audio.src) return;
    // 播放地址會過期：重取一次並回到原進度
    if (state.retried) { toast('播放失敗，請換一首或稍後再試'); return; }
    state.retried = true;
    var at = audio.currentTime || 0;
    var token = state.playToken;
    api.get('/api/playurl', { id: state.song.id }).then(function (data) {
      if (token !== state.playToken || !data.url) { if (!data.url) toast(data.message || '播放失敗'); return; }
      audio.src = data.url;
      audio.addEventListener('loadedmetadata', function once() {
        audio.removeEventListener('loadedmetadata', once);
        audio.currentTime = at;
      });
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    }).catch(function (e) { toast(e.message); });
  });

  $('loginBtn').addEventListener('click', openLogin);
  $('qrRefresh').addEventListener('click', startQr);
  $('login').addEventListener('click', function (e) {
    if (e.target === $('login') || e.target.hasAttribute('data-close')) closeLogin();
  });
  $('cookieSave').addEventListener('click', function () {
    var v = $('cookieBox').value.trim();
    if (!v) { toast('請先貼上 MUSIC_U'); return; }
    api.post('/api/cookie', { cookie: v }).then(function (r) {
      if (!r.ok) { toast(r.message || 'Cookie 無效或已過期'); return; }
      $('cookieBox').value = '';
      stopQr();
      refreshStatus().then(function () { toast('登入成功'); });
    }).catch(function (e) { toast(e.message); });
  });
  $('logoutBtn').addEventListener('click', function () {
    api.post('/api/logout').then(function () {
      state.loggedIn = false;
      state.profile = null;
      renderLoginState();
      startQr();
      toast('已登出');
    }).catch(function (e) { toast(e.message); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!$('login').hidden) closeLogin();
      else if (!$('player').hidden) $('player').hidden = true;
    }
  });

  // 頭像檔不存在時改顯示字母
  Array.prototype.forEach.call(document.querySelectorAll('.duo img'), function (img) {
    function fallback() {
      var span = el('span', 'av', img.dataset.fallback || '');
      img.replaceWith(span);
    }
    if (img.complete && !img.naturalWidth) fallback();
    else img.addEventListener('error', fallback);
  });

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', toggle);
      navigator.mediaSession.setActionHandler('pause', toggle);
      navigator.mediaSession.setActionHandler('nexttrack', function () { next(false); });
      navigator.mediaSession.setActionHandler('previoustrack', prev);
    } catch (e) { /* 舊版 WebView 不支援就略過 */ }
  }

  renderPlayState();
  refreshStatus();
  pollRemote();
})();

</script>
</body>
</html>
